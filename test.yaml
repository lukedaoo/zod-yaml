components:
  securitySchemes:
    TokenAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    KeyAuth: { type: apiKey, in: header, name: X-Key }

  parameters:
    ItemId:
      { name: item_id, in: path, required: true, schema: { type: string } }
    Key:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }

  schemas:
    Item:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [one, two, three]
        color: { type: string } # TBD

    Code:
      type: string
      enum:
        - forbidden
        - not_found

    Wrapped:
      allOf:
        - $ref: "#/components/schemas/Item"

    Request:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, side]
            properties:
              id: { type: string }
              side: { type: string, enum: [left, right, other] }
